# Model profilleri: Lab ekranları ve ajan aynı profilleri kullanır (core-003, plan F1.3).
# Her bileşen: provider (sağlayıcı türü) + o sağlayıcıya özgü ayarlar.
# Bileşen null ise o profilde ayrı bir STT/LLM/TTS yoktur (ör. L5'te ses doğrudan LLM'e, A2 tek modelli realtime).
# API anahtarları burada DEĞİL, ortam değişkenlerinde / .env dosyasında tutulur.

profiles:
  L1:
    name: Hızlı
    purpose: 16 GB Mac'te en düşük gecikme
    stt: {provider: mlx_whisper, model: mlx-community/whisper-large-v3-turbo}
    llm: {provider: ollama, model: "gemma4:e4b"}
    tts: {provider: ema}

  L2:
    name: Dengeli
    purpose: Önerilen başlangıç yığını
    stt: {provider: mlx_whisper, model: mlx-community/whisper-large-v3-turbo}
    llm: {provider: ollama, model: "qwen3:30b-a3b-instruct-2507-q4_K_M"}
    tts: {provider: ema}
    notes: "Canlıda EMA. Chatterbox, Qwen3 30B ile aynı anda bellekteyken (36 GB Mac) ikisini de bozuyor (ADR 0001); yalnızca TTS stüdyosunda tek başına, kör dinleme için kullanılır."

  L2-EL:
    name: Dengeli + ElevenLabs
    purpose: L2 ile aynı STT ve LLM; yalnızca TTS EMA yerine ElevenLabs (ton farkı ve doğallık denemesi)
    stt: {provider: mlx_whisper, model: mlx-community/whisper-large-v3-turbo}
    llm: {provider: ollama, model: "qwen3:30b-a3b-instruct-2507-q4_K_M"}
    tts: {provider: elevenlabs, model: eleven_v4_turbo}
    notes: "STT ve LLM L2 ile aynı örnekleri paylaşır (bellekte tek kopya). Ses ve ton Persona > Ses stüdyosu'ndan seçilir ve bir sonraki cümlede etki eder: ton -> o tona atanan ses, yoksa 'Genel ses', yoksa ELEVENLABS_VOICE_ID. TTS ağdan gelir; gecikmesi EMA'dan farklıdır, Playground'daki tur süresinden ölçülür (ölçülmedi)."

  L3:
    name: Doğruluk
    purpose: Türkçe ince ayarlı STT'nin katkısı
    stt: {provider: hf_whisper, model: BuzzASR/turkish}
    llm: {provider: ollama, model: "qwen3:30b-a3b-instruct-2507-q4_K_M"}
    tts: {provider: ema}

  L4:
    name: Alternatif LLM
    purpose: Fonksiyon çağrısı güvenilirliği
    stt: {provider: mlx_whisper, model: mlx-community/whisper-large-v3-turbo}
    llm: {provider: ollama, model: "gpt-oss:20b"}
    tts: {provider: ema}

  L5:
    name: Sesli LLM
    purpose: STT'siz hattın gecikme kazancı (ses doğrudan LLM'e; core-010)
    stt: null
    llm: {provider: ollama, model: "gemma4:12b", audio: true}   # audio: ses OpenAI uyumlu uçtan input_audio ile gider (core-010; Ollama'nın kabulü Mac'te doğrulanacak)
    tts: {provider: ema}

  A1:
    name: API referansı
    purpose: Lokal yığınların hedef çıtası
    stt: {provider: deepgram, model: nova-3}
    llm: {provider: anthropic, model: claude-haiku-5-5}
    tts: {provider: elevenlabs, model: eleven_flash_v2_5}

  A1S:
    name: API referansı (streaming)
    purpose: A1 ile aynı modeller; üretim benzeri gecikme (canlı STT + akışlı TTS + bağlantı yeniden kullanımı)
    fast_path: true   # 'evet/hayır/9' gibi kapalı sözlük cevaplarında LLM atlanır (flow.fastpath_obj)
    stt: {provider: deepgram, model: nova-3, streaming: true}
    llm: {provider: anthropic, model: claude-haiku-5-5}
    tts: {provider: elevenlabs, model: eleven_flash_v2_5, streaming: true}
    notes: "STT: konuşma sürerken ses Deepgram canlı WebSocket'ine akar (konuşma başına bir bağlantı); bitişe yerel VAD karar verir, Finalize ile son metin alınır. Bağlantı açılamaz, zaman aşımı olur, boş ya da STT geçidinden geçmeyen metin gelirse konuşmanın tamamı toplu (A1 ile aynı) çağrıyla yeniden çözülür (stats.stt_stream_fallbacks). TTS: /stream uç noktası, ses parça parça çalınır; ilk parçadan önce hata olursa cümle akışsız üretilir. LLM A1 ile aynı örnek. Gecikme kazancı bulutta ölçülemedi; scripts/latency_probe.py ile Mac'te ölçülür."

  A2:
    name: Realtime referansı
    purpose: Tek modelli hattın doğallığı ve gecikmesi
    mode: realtime
    realtime: {provider: openai_realtime, model: gpt-realtime-2.1-mini}
    stt: null
    llm: null
    tts: null

  A3:
    name: Realtime referansı (Gemini)
    purpose: A2 ile aynı test setinde ikinci speech-to-speech seçeneği
    mode: realtime
    realtime: {provider: gemini_live, model: gemini-3.8-live}
    stt: null
    llm: null
    tts: null
    notes: Türkçe desteği Google dokümanında doğrulanamadı; kıyas matrisinde test edilecek.

# TTS stüdyosuna özgü tek bileşenli profiller (lab-001): profil listesinde görünmez, yalnızca ses üretimi ve
# kör dinleme için kullanılır. Hazırla (keep_others=false) bu modeli bellekte tek başına bırakır.
studio_profiles:
  S-chatterbox:
    name: Chatterbox (yalnızca stüdyo)
    purpose: Kör dinlemede EMA / ElevenLabs ile karşılaştırma; canlı hatta kullanılmaz (ADR 0001 ek notu)
    stt: null
    llm: null
    tts: {provider: chatterbox}
